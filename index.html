<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Muhammad's Monster Truck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
/* Layout: full-screen night stadium. Tiny HUD on top (stars + progress to the cake), one giant GO button. The whole screen is also the gas pedal. */
:root{
  --night:#0a0f2e;
  --ink:#0f3d14;
  --truck:#36c23c;
  --sun:#ffd23a;
  --pop:#ff7a1a;
  --pink:#ff5fa2;
  --paper:#fffbea;
  --glass:rgba(10,15,46,.62);
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
body{background:var(--night);color:var(--paper);font-family:var(--display);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}

.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;pointer-events:none;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stars{background:var(--glass);border-radius:999px;padding:6px 14px 6px 8px;display:flex;align-items:center;gap:6px;font-size:28px;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums}
.stars i{font-style:normal;font-size:26px}
.stars.bump{animation:bump .35s ease-out}
@keyframes bump{40%{transform:scale(1.25)}}
.track{flex:1;min-width:0;height:12px;background:var(--glass);border-radius:999px;position:relative;margin-right:26px}
.track i{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--truck);border:3px solid var(--paper);left:0}
.track b{position:absolute;right:-30px;top:50%;transform:translateY(-55%);font-size:26px;font-weight:400}
#mute{pointer-events:auto;font-size:20px;line-height:1;color:var(--paper);background:var(--glass);border:0;border-radius:12px;padding:10px 12px;cursor:pointer}

#pop{position:fixed;left:0;right:0;top:22%;text-align:center;pointer-events:none;opacity:0;
  font-size:clamp(56px,12vw,120px);line-height:1;color:var(--sun);-webkit-text-stroke:.07em var(--night);paint-order:stroke fill}
#pop.go{animation:popw 1.3s ease-out forwards}
@keyframes popw{0%{opacity:0;transform:scale(.3) rotate(-8deg)}15%{opacity:1;transform:scale(1.15) rotate(3deg)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}

.pedals{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(20px + env(safe-area-inset-bottom,0px))}
.pedals button{pointer-events:auto;touch-action:none;cursor:pointer;border:5px solid var(--night);border-radius:50%;display:grid;place-items:center;transition:transform .06s,box-shadow .06s}
#honk{width:82px;height:82px;background:var(--sun);font-size:36px;box-shadow:0 6px 0 var(--night)}
#gas{width:136px;height:136px;background:var(--truck);color:var(--paper);font-family:var(--display);font-size:44px;-webkit-text-stroke:.06em var(--ink);paint-order:stroke fill;box-shadow:0 8px 0 var(--night);position:relative}
#gas.on,#honk:active{transform:translateY(6px);box-shadow:0 2px 0 var(--night)}
#gas.hint::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:6px solid var(--sun);animation:ring 1.1s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.85)}to{opacity:0;transform:scale(1.25)}}
button:focus-visible{outline:4px solid var(--pop);outline-offset:4px}

.screen{position:fixed;inset:0;display:grid;place-items:center;background:rgba(6,9,30,.5);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.card{width:100%;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.face{width:150px;height:150px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:var(--sun);border:6px solid var(--sun);box-shadow:0 0 0 6px var(--night)}
h1{margin:0;font-weight:400;font-size:clamp(38px,8vw,70px);line-height:.95;color:var(--sun);-webkit-text-stroke:.08em var(--night);paint-order:stroke fill;text-wrap:balance}
.round{width:120px;height:120px;border-radius:50%;border:6px solid var(--night);background:var(--truck);color:var(--paper);font-size:54px;line-height:1;cursor:pointer;box-shadow:0 8px 0 var(--night);padding-left:10px;animation:breathe 1.4s ease-in-out infinite}
.round.again{padding-left:0;background:var(--sun);color:var(--ink);font-size:58px}
@keyframes breathe{50%{transform:scale(1.07)}}

#banner{background:transparent;align-items:start;padding-top:calc(60px + env(safe-area-inset-top,0px))}
#banner .card{gap:8px}
#banner .l1,#banner .l2{line-height:.95;-webkit-text-stroke:.09em var(--night);paint-order:stroke fill}
#banner .l1{font-size:clamp(30px,6.4vw,68px);color:var(--paper);animation:in .5s cubic-bezier(.2,1.6,.4,1) both}
#banner .l1 em{font-style:normal;color:var(--pop)}
#banner .l2{white-space:nowrap;font-size:clamp(50px,12.5vw,150px);color:var(--sun);filter:drop-shadow(0 .06em 0 var(--night))}
#banner .l2 span{display:inline-block;animation:in .6s cubic-bezier(.2,1.7,.4,1) both, wob 1.6s ease-in-out infinite;animation-delay:calc(var(--i)*70ms + 300ms), calc(var(--i)*120ms + 1.2s)}
#banner .got{font-size:30px;color:var(--sun);background:var(--glass);border-radius:999px;padding:6px 16px}
@keyframes in{from{opacity:0;transform:translateY(.6em) scale(.3) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes wob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.06em) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){#banner .l2 span,#banner .l1,.round,#gas.hint::after{animation:none}#pop.go{animation:none;opacity:1}}
</style>
</head>
<body>
<canvas id="stage" aria-label="Monster truck game: hold anywhere to drive Muhammad's green monster truck over jumps and through a loop to his birthday cake"></canvas>

<div class="hud">
  <div class="stars" id="starsBox"><i>⭐</i><span id="stars">0</span></div>
  <div class="track" aria-hidden="true"><i id="dot"></i><b>🎂</b></div>
  <button id="mute" type="button" aria-label="Sound on or off">🔊</button>
</div>
<div id="pop" aria-live="polite"></div>
<div class="pedals">
  <button id="honk" type="button" aria-label="Honk the horn">📯</button>
  <button id="gas" class="hint" type="button" aria-label="Hold to drive">GO</button>
</div>

<div id="start" class="screen">
  <div class="card">
    <img class="face" id="face" alt="Muhammad">
    <h1>Muhammad's Monster Truck</h1>
    <button id="play" class="round" type="button" aria-label="Play">▶</button>
  </div>
</div>

<div id="banner" class="screen" hidden>
  <div class="card">
    <div class="l1">Happy <em>4th</em> Birthday</div>
    <div class="l2" data-text="MUHAMMAD"></div>
    <div class="got">⭐ <span id="final">0</span></div>
    <button id="again" class="round again" type="button" aria-label="Play again">↻</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function canvasTex(w,h,draw,repeat){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;if(repeat){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(repeat[0],repeat[1]);}return t;}

/* ===== physics =====
   Rigid chassis + two axles on spring/damper suspension (30" of travel ≈ 1.14 units).
   Tyres push along the suspension axis; traction acts along the dirt. */
const M=1, INERTIA=5, S_FREE=1.2, S_REST=.75, S_BUMP=.08;
const K=M*GRAV/2/(S_FREE-S_REST), C=1.9, KB=500, CB=18;
const DRIVE=12, POWER=235, MU=1.05;
const BODY_PTS=[[3.35,.07],[-3.3,.07],[3.1,1.0],[-3.15,1.0],[.45,3.25],[-.7,3.25],[0,3.3]];
const st={}; const axles=[{lx:WB},{lx:-WB}];
let trick=null,trickDone=0,progX=0,started=false,finished=false,celebrated=false,finT=0,stars=0,jiggle=0,stuckT=0,flipT=0,airT=0,wasAir=false,helpT=0,cheerOn=false,lastPop=0;
let pressing=false;
function predictAir(){let x=st.x,y=st.y,vx=st.vx,vy=st.vy,t=0;const h=1/60;
  while(t<5){vy-=GRAV*h;x+=vx*h;y+=vy*h;t+=h;if(t>.15&&y-COM_Y<=G(x))break;}return{t,x};}
function reset(){trick=null;trickDone=0;Object.assign(st,{x:-2,y:COM_Y,vx:0,vy:0,th:0,w:0,mode:'phys',phi:0,v:0,z:0,zFrom:0,zAt:-999});
  axles.forEach(a=>{a.s=S_REST;a.sp=S_REST;a.contact=true;a.spin=0;a.ang=0;a.F=0;});
  finished=false;celebrated=false;finT=0;stars=0;stuckT=0;flipT=0;airT=0;wasAir=false;helpT=0;$('stars').textContent='0';
  obstacles.forEach(o=>{o.sy=1;o.target=1;o.hit=false;o.grp.scale.y=1;o.grp.visible=true;});
  starList.forEach(s=>{s.got=false;s.m.visible=true;});
  confetti.forEach(c=>scene.remove(c.m));confetti.length=0;bursts.forEach(b=>scene.remove(b.p));bursts.length=0;
  $('banner').hidden=true;drawScreen(0);camInit=false;}
function ray(ax,ay,dx,dy,maxT){if(ay-G(ax)<=0)return 0;const N=20;let t0=0;
  for(let i=1;i<=N;i++){const t=maxT*i/N;if(ay+dy*t-G(ax+dx*t)<=0){let a=t0,b=t;for(let k=0;k<7;k++){const m=(a+b)/2;if(ay+dy*m-G(ax+dx*m)>0)a=m;else b=m;}return (a+b)/2;}t0=t;}return Infinity;}
function obstacleAt(x){for(const o of obstacles)if(x>o.x0&&x<o.x1)return o;return null;}
function physStep(h,throttle){
  const c=Math.cos(st.th),s=Math.sin(st.th); const dx=s,dy=-c; // chassis "down"
  let fx=0,fy=-GRAV*M,tq=0,contacts=0;
  const sp=Math.hypot(st.vx,st.vy); fx-=.008*sp*st.vx; fy-=.008*sp*st.vy;
  for(const a of axles){
    const ax=st.x+a.lx*c, ay=st.y+a.lx*s;
    const t=ray(ax,ay,dx,dy,S_FREE+R+.15);
    if(t-R<S_FREE){
      let sv=t-R; if(sv<-.15){ st.x-=dx*(-.15-sv)*.5; st.y-=dy*(-.15-sv)*.5; sv=-.15; }
      const sdot=(sv-a.sp)/h; a.sp=sv; a.s=sv;
      let F=K*(S_FREE-sv)-C*sdot; if(sv<S_BUMP) F+=KB*(S_BUMP-sv)-CB*sdot; F=Math.max(0,Math.min(160,F)); a.F=F;
      const px=ax, py=ay; fx+=-dx*F; fy+=-dy*F; tq+=(px-st.x)*(-dy*F)-(py-st.y)*(-dx*F);
      // traction at the contact patch
      const cx=ax+dx*(sv+R), cy=ay+dy*(sv+R); const sl=slopeAt(cx); const n=Math.hypot(1,sl), tx=1/n, ty=sl/n;
      const rx=cx-st.x, ry=cy-st.y; const vcx=st.vx-st.w*ry, vcy=st.vy+st.w*rx; const vt=vcx*tx+vcy*ty;
      let Ft=throttle*Math.min(DRIVE,POWER/Math.max(1,Math.abs(vt)))/2 - vt*(throttle>0?.02:(finished?.45:.25)) - Math.sign(vt)*Math.min(Math.abs(vt)*4,.35);
      const lim=MU*F; Ft=Math.max(-lim,Math.min(lim,Ft));
      fx+=tx*Ft; fy+=ty*Ft; tq+=rx*(ty*Ft)-ry*(tx*Ft);
      a.spin=vt/R; a.contact=true; contacts++;
      const o=obstacleAt(cx); if(o&&!o.hit&&F>11){o.hit=true;o.target=o.squash;crushFx(o);}
    } else { a.contact=false; a.F=0; a.sp+= (S_FREE-a.sp)*Math.min(1,h*12); a.s=a.sp; a.spin+=throttle?(26-a.spin)*h*2:-a.spin*h*.3; }
  }
  // body hits the dirt (only when things go really wrong)
  for(const [lx,ly] of BODY_PTS){const qx=st.x+lx*c-ly*s, qy=st.y+lx*s+ly*c; const gy=G(qx); if(qy<gy){
      const sl=slopeAt(qx),n=Math.hypot(1,sl),nx=-sl/n,ny=1/n,pen=(gy-qy)*ny; const rx=qx-st.x,ry=qy-st.y;
      const vqx=st.vx-st.w*ry,vqy=st.vy+st.w*rx,vn=vqx*nx+vqy*ny; const Fn=Math.max(0,300*pen-14*vn);
      const vtx=vqx-vn*nx,vty=vqy-vn*ny; const ffx=nx*Fn-vtx*3,ffy=ny*Fn-vty*3; fx+=ffx;fy+=ffy;tq+=rx*ffy-ry*ffx;}}
  // airborne: a gentle hand keeps the nose lined up with the landing (real drivers do this with gas/brake)
  if(contacts===0){ const hAbove=Math.max(0,st.y-COM_Y-G(st.x)); const tl=(st.vy+Math.sqrt(st.vy*st.vy+2*GRAV*hAbove))/GRAV;
    const target=Math.atan(slopeAt(st.x+st.vx*tl))*.9+.05; tq+=10*wrap(target-st.th)-6*st.w; }
  st.vx+=fx/M*h; st.vy+=fy/M*h; st.w+=tq/INERTIA*h; st.x+=st.vx*h; st.y+=st.vy*h; st.th+=st.w*h;
  return contacts;
}
function crushFx(o){const cx=(o.x0+o.x1)/2; if(o.kind==='gift'){spawnConfetti(cx,o.h+1,70,3);boing();} else {for(let i=0;i<10;i++)emit(dust,V(cx+rnd(-1,1),1.2,rnd(-2,2)),V(rnd(-2,2),rnd(1,3),rnd(-1,1)),1.4,1);}
  tone(110,0,.25,'sawtooth',.12); if(performance.now()-lastPop>1500){pop('💥');} }
function pop(t){lastPop=performance.now();const el=$('pop');el.textContent=t;el.classList.remove('go');void el.offsetWidth;el.classList.add('go');}

function update(dt){
  const throttle=started&&!finished&&pressing?1:0;
  if(st.mode==='phys'){
    const n=10,h=dt/n; let contacts=0; for(let i=0;i<n;i++) contacts=physStep(h,throttle);
    const air=contacts===0;
    // big jumps get an automatic, exaggerated backflip (a double over the presents)
    if(air&&!wasAir&&!trick){const J=[J1,J2].find(J=>Math.abs(st.x-J.lip)<4);
      if(J&&st.vx>5){st.vy*=(J===J2?1.25:1.15);const pr=predictAir();
        if(pr.t>.6){const N=(J===J2&&pr.t>1.15)?2:1;trick={t:0,T:pr.t*.84,th0:st.th,thEnd:Math.PI*2*N+Math.atan(slopeAt(pr.x))*.9+.05,N};boing();}}}
    if(trick){ if(air){trick.t+=dt;const u=Math.min(1,trick.t/trick.T);const e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;const de=u<.5?4*u:4*(1-u);
        st.th=trick.th0+(trick.thEnd-trick.th0)*e;st.w=(trick.thEnd-trick.th0)*de/trick.T;
        if(u>=1){st.th=wrap(st.th);st.w=0;trickDone=trick.N;trick=null;}}
      else {st.th=wrap(st.th);st.w=0;trickDone=trick.N;trick=null;} }
    if(air){airT+=dt;} else { if(wasAir&&trickDone){pop(trickDone>1?'FLIP! FLIP!':'FLIP!');cheer();firework(st.x+8,18,-10,0xffd23a);if(trickDone>1)firework(st.x-4,20,-12,0xff5fa2);trickDone=0;} else if(wasAir&&airT>1.15){pop('WOW!');cheer();} if(wasAir&&airT>.4){for(let i=0;i<18;i++)emit(dust,V(st.x+rnd(-3,3),G(st.x)+.3,st.z+rnd(-2,2)),V(rnd(-3,3),rnd(1,3),rnd(-1,1)),1.7,rnd(.8,1.4));} airT=0; }
    wasAir=air;
    // into the loop
    if(!air && st.x>=LOOP_X && st.x-st.vx*dt<LOOP_X && st.vx>1 && Math.abs(st.th)<.4){st.mode='loop';st.phi=0;st.v=Math.max(st.vx,12);}
    // helpers so a four-year-old never gets stuck
    const speed=Math.hypot(st.vx,st.vy);
    if(started&&!finished&&st.mode==='phys'){if(throttle)stuckT+=dt; if(st.x>progX+3){progX=st.x;stuckT=0;}} else {stuckT=0;progX=st.x;}
    if(stuckT>1.8){stuckT=0;progX=st.x;st.vx=Math.max(st.vx,0)+11;st.vy+=12;st.w=0;helpT=.5;st.w=0;boing();sparkle(st.x,st.y);}
    if(Math.abs(wrap(st.th))>1.3&&speed<4) flipT+=dt; else flipT=0;
    if(flipT>.9){flipT=0;helpT=.8;boing();sparkle(st.x,st.y);}
    if(helpT>0){helpT-=dt;st.vy=Math.max(st.vy,3.5);st.w=-wrap(st.th)*4;}
  } else {
    const a=(throttle?9:0)-GRAV*Math.sin(st.phi)*.6; st.v=Math.max(12,Math.min(30,st.v+a*dt)); st.phi+=st.v/(LR-COM_Y)*dt;
    if(st.phi>=Math.PI*2){st.mode='phys';st.x=LOOP_X+.05;st.y=COM_Y;st.vx=st.v;st.vy=0;st.th=0;st.w=0;st.zFrom=LOOP_Z;st.zAt=st.x;axles.forEach(a=>{a.sp=S_REST;});
      pop('YAY!');cheer();firework(LOOP_X+4,22,-10,0x7fd4ff);firework(LOOP_X-6,20,-12,0xff5fa2);}
    else{const rr=LR-COM_Y;st.x=LOOP_X+rr*Math.sin(st.phi);st.y=LR-rr*Math.cos(st.phi);st.th=st.phi;st.z=LOOP_Z*st.phi/(Math.PI*2);
      st.vx=st.v*Math.cos(st.phi);st.vy=st.v*Math.sin(st.phi);
      const squat=Math.min(.45,st.v*st.v/rr/GRAV*.18);axles.forEach(a=>{a.s=S_REST-squat;a.spin=st.v/R;});}
  }
  if(st.mode==='phys') st.z = st.x>st.zAt ? st.zFrom*Math.max(0,1-(st.x-st.zAt)/18) : 0;
  // stars
  const ux=-Math.sin(st.th),uy=Math.cos(st.th);
  for(const s of starList){ if(s.got)continue; const ddx=s.x-(st.x+ux*.8), ddy=s.y-(st.y+uy*.8); if(ddx*ddx+ddy*ddy<2.9*2.9){s.got=true;s.m.visible=false;stars++;
      $('stars').textContent=stars;const b=$('starsBox');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');ding();sparkle(s.x,s.y);drawScreen(stars);} }
  if(!finished&&st.x>=FINISH_X){finished=true;finT=0;cheer();pyro(FINISH_X,0);}
  if(finished){finT+=dt;if(!celebrated&&(finT>3||(finT>.8&&Math.abs(st.vx)<1.2)))celebrate();}
}
function sparkle(x,y){for(let i=0;i<16;i++)emit(sparks,V(x,y,st.z),V(rnd(-5,5),rnd(-5,5),rnd(-2,2)),rnd(.5,.9),rnd(.4,.7));}
function celebrate(){celebrated=true;$('final').textContent=stars+' / '+STAR_TOTAL;$('banner').hidden=false;spawnConfetti(st.x+6,12,360,16);birthdaySong();cheer();
  [[-6,15,-8,0xffd23a],[10,16,-9,0xff5fa2],[2,19,-12,0x7fd4ff],[-12,13,-10,0x36c23c],[16,13,-8,0xff7a1a],[4,17,-11,0xffffff]].forEach((f,i)=>setTimeout(()=>firework(st.x+f[0],f[1],f[2],f[3]),i*380));}

/* ===== input: hold anywhere ===== */
const gasBtn=$('gas');
const down=e=>{if(!started)return;if(e.target.closest&&e.target.closest('#honk,#mute,.screen'))return;e.preventDefault&&e.preventDefault();audioInit();pressing=true;gasBtn.classList.add('on');gasBtn.classList.remove('hint');};
const up=()=>{pressing=false;gasBtn.classList.remove('on');};
addEventListener('pointerdown',down,{passive:false}); addEventListener('pointerup',up); addEventListener('pointercancel',up); addEventListener('blur',up);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('keydown',e=>{if(e.code==='Space'||e.code.startsWith('Arrow')||e.code==='Enter'){e.preventDefault();if(!started){go();return;}if(e.code==='KeyH')return;down({target:document.body});}
  if(e.code==='KeyH')honk();});
addEventListener('keyup',e=>{if(e.code==='Space'||e.code.startsWith('Arrow')||e.code==='Enter')up();});
$('honk').addEventListener('click',honk);
function go(){audioInit();if(actx&&actx.state==='suspended')actx.resume();$('start').hidden=true;started=true;honk();}
$('play').addEventListener('click',e=>{e.stopPropagation();go();});
$('again').addEventListener('click',e=>{e.stopPropagation();reset();started=true;gasBtn.classList.add('hint');});

/* ===== frame ===== */
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();let camInit=false;
reset();
let last=performance.now(),clock=0;
function frame(now){
  const dt=Math.max(.001,Math.min(.033,(now-last)/1000));last=now;clock+=dt;
  const slow=trick?1-.5*Math.sin(Math.PI*Math.min(1,trick.t/trick.T)):1;
  update(dt*slow);
  truck.position.set(st.x,st.y,st.z);truck.rotation.z=st.th;
  // wheels + shocks follow the suspension
  axles.forEach((a,i)=>{const ax=axleMeshes[i];ax.position.y=COM_Y-a.s;a.ang-=a.spin*dt;wheelMeshes[i].forEach(w=>w.rotation.z=a.ang);});
  shocks.forEach(sk=>{const i=sk.x>0?0:1;const wy=COM_Y-axles[i].s;const bot=V(sk.x,wy,sk.sz*1.1),top=V(sk.x*.78,2.75,sk.sz*.95);
    setTube(sk.outer,V().lerpVectors(bot,top,.45),top);setTube(sk.inner,bot,V().lerpVectors(bot,top,.55));});
  jiggle=Math.max(0,jiggle-dt*.8);
  const party=celebrated?1:0;
  kid.position.y=.45+KID_H/2+Math.abs(Math.sin(clock*(party?7:4)))*(.03+party*.12+jiggle*.15)+Math.min(.25,Math.abs(st.w)*.03);
  kid.material.rotation=st.th+Math.sin(clock*(party?5:3))*(.03+party*.07+jiggle*.12);
  const spd=Math.hypot(st.vx,st.vy);
  if(st.mode==='phys'&&axles[1].contact&&spd>3){const c=Math.cos(st.th),s=Math.sin(st.th);emit(dust,V(st.x-WB*c+rnd(-.3,.3),G(st.x-WB*c)+.4,st.z+(Math.random()<.5?-WZ:WZ)),V(-Math.sign(st.vx)*rnd(.5,2),rnd(.6,1.6),rnd(-.6,.6)),rnd(.9,1.4)*Math.min(1.5,spd/14),rnd(.8,1.3));}
  stepPool(dust,dt,2.2,.5,0);stepPool(flames,dt,.6,.9,-14);stepPool(sparks,dt,.4,1,0);
  obstacles.forEach(o=>{o.sy+=(o.target-o.sy)*Math.min(1,dt*16);o.grp.scale.y=o.sy;});
  starList.forEach((s,i)=>{if(!s.got){s.m.rotation.y=clock*2.4+i;s.m.position.y=s.y+Math.sin(clock*2+i)*.15;}});
  candleFlames.forEach((f,i)=>{const k=1+Math.sin(clock*18+i*2)*.12+Math.sin(clock*7+i)*.08;f.scale.set(.6*k,1.05*k,1);});
  confetti.forEach(c=>{if(c.landed)return;c.m.position.y+=c.vy*dt;c.m.position.x+=Math.sin(clock*c.sw+c.ph)*dt*1.2;c.m.rotation.x+=c.spin.x*dt;c.m.rotation.y+=c.spin.y*dt;c.m.rotation.z+=c.spin.z*dt;
    const gy=G(c.m.position.x);if(c.m.position.y<gy+.05){c.landed=true;c.m.position.y=gy+.03;c.m.rotation.set(-Math.PI/2,0,c.ph);}});
  for(let i=bursts.length-1;i>=0;i--){const b=bursts[i];b.life-=dt;const a=b.p.geometry.attributes.position;
    for(let j=0;j<b.vel.length;j++){b.vel[j].y-=4*dt;b.vel[j].multiplyScalar(.985);a.array[j*3]+=b.vel[j].x*dt;a.array[j*3+1]+=b.vel[j].y*dt;a.array[j*3+2]+=b.vel[j].z*dt;}
    a.needsUpdate=true;b.p.material.opacity=Math.max(0,b.life/1.8);if(b.life<=0){scene.remove(b.p);bursts.splice(i,1);}}
  balloons.forEach(b=>{b.m.position.y=b.y+Math.sin(clock*1.1+b.ph)*.35;if(b.big)b.m.rotation.y=Math.sin(clock*.7+b.ph)*.4;});
  if(eng){const f=40+spd*4+(pressing&&started?16:0);eng.o1.frequency.setTargetAtTime(f,actx.currentTime,.08);eng.o2.frequency.setTargetAtTime(f*.5,actx.currentTime,.08);
    eng.g.gain.setTargetAtTime(started&&!celebrated?.05:0,actx.currentTime,.2);}
  $('dot').style.left=(Math.max(0,Math.min(1,(st.x+2)/(CAKE_X+2)))*100)+'%';

  // camera: side-on like the TV broadcast, pulling back for big air and the loop
  const aspect=camera.aspect,portrait=aspect<1;
  const loopCam=st.mode==='loop'||(st.x>LOOP_X-14&&st.x<LOOP_X+6&&!wasAir);
  const hAbove=Math.max(0,st.y-COM_Y-G(st.x));
  let base=celebrated?24:(loopCam?32:26+hAbove*.9);
  const dist=aspect<1.3?Math.min(70,base*1.3/aspect):base;
  const tx=loopCam?LOOP_X:(celebrated?(st.x+CAKE_X)/2+2:st.x+st.vx*.3);
  const ty=loopCam?LR:st.y*.65+(portrait?4.5:2.6)+(celebrated?(portrait?4:3.2):0);
  const want=V(tx+(celebrated?Math.sin(clock*.25)*3:0),ty+2.4,dist),look=V(tx,ty,0);
  if(!camInit){camPos.copy(want);camLook.copy(look);camInit=true;}
  const k=1-Math.exp(-dt*3);camPos.lerp(want,k);camLook.lerp(look,k);
  camera.position.copy(camPos);camera.lookAt(camLook);
  sun.position.set(st.x+8,32,16);sun.target.position.set(st.x,0,0);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
</body>
</html>
